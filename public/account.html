<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Личный кабинет — Сладкий Дом</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/header-footer.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>

  <header class="header" id="header">
    <div class="container">
      <div class="header__inner">
        <a href="/" class="logo">
          <span class="logo__icon">🍰</span>
          <span class="logo__text">
            <span class="logo__name">Сладкий Дом</span>
            <span class="logo__tagline">торты &amp; кофе</span>
          </span>
        </a>

        <nav class="nav" id="nav">
          <a href="/" class="nav__link">Главная</a>
          <a href="/catalog.html?type=cake" class="nav__link">Торты</a>
          <a href="/catalog.html?type=coffee" class="nav__link">Кофе</a>
        </nav>

        <div class="header__actions">
          <a href="/cart.html" class="icon-btn" aria-label="Корзина">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="21" r="1"></circle>
              <circle cx="19" cy="21" r="1"></circle>
              <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
            </svg>
            <span class="icon-btn__badge" id="cart-badge" style="display:none">0</span>
          </a>
          <button class="burger" id="burger" aria-label="Меню">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <div class="page-header__inner">
        <div class="breadcrumbs">
          <a href="/">Главная</a>
          <span class="breadcrumbs__sep">/</span>
          <span>Личный кабинет</span>
        </div>
        <h1 class="page-header__title">Личный кабинет</h1>
        <p class="page-header__desc">Ваши заказы и настройки профиля</p>
      </div>
    </div>
  </section>

  <main class="account">
    <div class="container" id="account-container">
      <div class="loading">
        <div class="loading__spinner"></div>
        Загружаем данные...
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer__bottom" style="justify-content: center;">
        <span>© 2026 Сладкий Дом. Все права защищены.</span>
      </div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
