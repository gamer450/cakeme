<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Cake.Me</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="/css/design-system.css" />
  <link rel="stylesheet" href="/css/premium-effects.css" />
  <link rel="stylesheet" href="/css/header-footer.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>

  <header class="header" id="header">
    <div class="container">
      <div class="header__inner">
        <a href="/" class="logo">
          <span class="logo__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v4M8 6h8v4H8zM6 10h12l-1 10H7L6 10z"/>
              <path d="M10 15h4M10 18h4"/>
            </svg>
          </span>
          <span class="logo__text">
            <span class="logo__name" data-setting="site_name">Cake.Me</span>
            <span class="logo__tagline">торты &amp; кофе</span>
          </span>
        </a>
        <div class="header__actions">
          <a href="/" class="btn btn-ghost btn-sm">← На главную</a>
        </div>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-card__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="auth-card__title">Вход в аккаунт</h1>
      <p class="auth-card__subtitle">Войдите, чтобы видеть историю заказов</p>

      <form class="auth-form" id="login-form" novalidate>
        <div class="auth-form__error" id="form-error"></div>

        <div class="auth-form__field">
          <label class="auth-form__label" for="email">Email</label>
          <input type="email" id="email" class="auth-form__input" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="auth-form__field">
          <label class="auth-form__label" for="password">Пароль</label>
          <div class="auth-form__password-wrap">
            <input type="password" id="password" class="auth-form__input" placeholder="Минимум 6 символов" required autocomplete="current-password" />
            <button type="button" class="auth-form__toggle" id="toggle-password" aria-label="Показать пароль">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg auth-form__btn magnetic" id="submit-btn">
          Войти
        </button>
      </form>

      <div class="auth-card__footer">
        Нет аккаунта? <a href="/register.html">Зарегистрироваться</a>
      </div>

      <div class="auth-card__demo">
        <div class="auth-card__demo-title">Тестовые аккаунты</div>
        <div class="auth-card__demo-buttons">
          <button class="demo-btn" data-demo="client">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Клиент
          </button>
          <button class="demo-btn" data-demo="manager">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="14" x="2" y="7" rx="2"/>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
            Менеджер
          </button>
          <button class="demo-btn" data-demo="admin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 20h20l-2-9-4 3-4-7-4 7-4-3z"/>
            </svg>
            Админ
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/premium.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
