<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Спасибо за заказ! — Сладкий Дом</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Новый дизайн 2027 -->
  <link rel="stylesheet" href="/css/design-system.css" />
  <link rel="stylesheet" href="/css/premium-effects.css" />

  <!-- Стили проекта -->
  <link rel="stylesheet" href="/css/header-footer.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/animations.css" />

  <style>
    .thanks {
      padding: 80px 0 120px;
      text-align: center;
    }
    .thanks__icon {
      font-size: 6rem;
      margin-bottom: 24px;
      animation: bounceIn 0.8s var(--ease-bounce) both;
    }
    .thanks__title {
      font-size: clamp(2rem, 4vw, 3rem);
      margin-bottom: 16px;
    }
    .thanks__text {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 560px;
      margin: 0 auto 32px;
      line-height: 1.7;
    }
    .thanks__order {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 28px;
      background: var(--white);
      border-radius: var(--r-full);
      box-shadow: var(--shadow-md);
      margin-bottom: 40px;
      animation: fadeInUp 0.8s var(--ease) 0.3s both;
    }
    .thanks__order-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .thanks__order-id {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--pink-hover);
    }
    .thanks__actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <!-- ============ ШАПКА ============ -->
  <header class="header" id="header">
    <div class="container">
      <div class="header__inner">
        <a href="/" class="logo">
          <span class="logo__icon">🍰</span>
          <span class="logo__text">
            <span class="logo__name" data-setting="site_name">Сладкий Дом</span>
            <span class="logo__tagline">торты &amp; кофе</span>
          </span>
        </a>

        <nav class="nav" id="nav">
          <a href="/" class="nav__link">Главная</a>
          <a href="/catalog.html?type=cake" class="nav__link">Торты</a>
          <a href="/catalog.html?type=coffee" class="nav__link">Кофе</a>
        </nav>

        <div class="header__actions">
          <a href="/cart.html" class="icon-btn" aria-label="Корзина">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="21" r="1"></circle>
              <circle cx="19" cy="21" r="1"></circle>
              <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
            </svg>
          </a>
          <button class="burger" id="burger" aria-label="Меню">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ============ СПАСИБО ============ -->
  <main class="thanks">
    <div class="container">
      <div class="thanks__icon">🎉</div>
      <h1 class="thanks__title">Спасибо за заказ!</h1>
      <p class="thanks__text">
        Мы уже начали его готовить. Менеджер свяжется с вами
        в течение 15 минут для подтверждения.
      </p>

      <div class="thanks__order" id="order-info" style="display:none">
        <span class="thanks__order-label">Номер заказа</span>
        <span class="thanks__order-id" id="order-id">—</span>
      </div>

      <div class="thanks__actions">
        <a href="/catalog.html" class="btn btn-primary btn-lg">Вернуться в каталог</a>
        <a href="/" class="btn btn-secondary btn-lg">На главную</a>
      </div>
    </div>
  </main>

  <!-- ============ ПОДВАЛ ============ -->
  <footer class="footer">
    <div class="container">
      <div class="footer__bottom" style="justify-content: center;">
        <span>© 2026 Сладкий Дом. Все права защищены.</span>
      </div>
    </div>
  </footer>

  <script src="/js/premium.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/main.js"></script>
  <script>
    // Показываем номер заказа из URL
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    if (orderId) {
      document.getElementById('order-info').style.display = 'inline-flex';
      document.getElementById('order-id').textContent = '№' + orderId;
    }
  </script>
</body>
</html>
